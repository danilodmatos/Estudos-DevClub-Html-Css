<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important</title>
</head>
<body>
    <h1>Aula !Important</h1>
</body>
<style>
    h1{
        color: blue !important; /*Quando eu marco uma tag com "!important" no css, ele entende que aquela tag é importante, logo, mesmo o css sendo em cascata, aquela tag permanecerá em uso*/
        color: red;
    }

</style>
</html>
