<!-- Videos -->

<video controls width="1400" height="550">
    <source src="./Video/video proatividade.mov">
    <source src="./Video/video proatividade.mkv">
    <source src="./Video/video proatividade.mp4">
</video>

<!-- Configurações da tag Video-->
<!-- controls: habilita os controles do vídeo-->
<!-- controlsList: para esse atributo há 3:
            "nodownload": desabilita a opção de download  
    -->
<!-- autoplay: assim que a pagina carregar fará o vídeo rodar automaticamente
     Obs.: Alguns navegadores boqueiam o "autoplay"
    -->
<!-- muted: faz com que o vídeo comece mutado
    Obs.: O chrome permite esse-->
<!-- poster: coloca uma imagem no inicio do vídeo, uma capa-->
<!-- higth e width: isso me possibilita alterar o tamanho de espaço do vídeo através dos pixels-->

<!-- source -->
    <!-- O uso do source serve para alocar um vídeo; ex. de uso: Há varias versões do meu vídeo (mp4, mkv, mov), visto isso o navegador vai analisar todos os source com seus tipos de videos disponiveis, o que rodar, ele vai passar na tela do usuário, isso serve para ter certeza que que vídeo vai rodar em tal navegador-->
