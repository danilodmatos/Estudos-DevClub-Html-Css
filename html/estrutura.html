<!DOCTYPE html> <!-- Define a versão do HTML (HTML5)-->
<html lang="pt-br"> <!--Define que é um arquivo HTML-->

    <head> <!-- Parte NÃO visual do site, configuração do site-->
        <meta charset="UTF-8"> <!-- Está dizendo para nosso site o padrão de caractere que a gente usa aqui no ocidente, -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge"><!--Isso aqui é visando os computados que usam "Internet Explorer" para que possa rodar nessas maquinas; torna nosso site compativel-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Permite que nosso site seja responsivo,compativel tanto com computadores, e celulares-->
        <title>Meu site brabo das galaxias</title>
    </head>

    <body> <!-- Parte visível do site-->
        <h1>Escrever meu primeiro site</h1>
        <p>Esse meu paragrafo é brabo</p>
        <button>Dá o like e compartilha, tamo junto vamos lá</button>
    </body>

</html>
