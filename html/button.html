<!-- BUTTON

type
    - submit
    - button
    - reset

-->

<form action="" method="GET">

    <button type="reset"> ENVIAR</button>
    <!--Zera todos os campso do input, Obs.: Para se usar o "reset" o input precisa estar dentro do "form"-->

    <button type="submit">ENVIAR</button>
    <!--Esse botão envia os dados do formulario; Obs.: É necessario também que o o botão do tipo "submit" esteja dentro de um "form" para que seja usado-->

    <button type="button">ENVIAR</button>
    <!--Ele é simplesmente um botão porem ele abre varias opçoes para ser manipulada-->

    <!--Button - "onclick", "disabled"-->
    <button type="button" onclick="">ENVIAR</button>
    <!--sempre que clicar no botão, vai fazer o que está dentro das " " de onclick; Isso é usado em comum com o JS-->

    <button type="button" disabled>ENVIAR</button> <!--Põe o botão como desabilitado-->


</form>
