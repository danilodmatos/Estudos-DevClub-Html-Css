
<!-- Imagens -->

<img src="../imagem_de_teste.png" alt="Danilo em missão"> <!-- "src": source, é a origem; "alt": é o texto alternativo, coopera com a acessibilidade, e ajuda os motores de busca a identificar e indicar um temda de conteudo, se a imagem também não carregar  vai aparecer esse texto-->

<figure>
    <img src="../imagem_de_teste.png" alt="Danilo em missão">
    <figcaption>Danilo em missão</figcaption>
</figure> <!-- Dentro da tag "figure" posso colocar o "figcaption" que faz uma descrição/legenda da imagem-->

<img src="../imagem_de_teste.png" alt="Danilo em missão" height="200px" width="400px"> <!--Posso também no img, alterar a altura (heigth) e a largura(width), o ideal é colocar um ou outro(pois ele ajusta), para não quebrar a imagem-->
